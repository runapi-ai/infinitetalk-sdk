[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-infinitetalk"
version = "0.2.1"
description = "RunAPI InfiniteTalk SDK for audio-driven talking video workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "infinitetalk", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "video-generation", "text-to-video", "video-api", "infinitetalk-api"]
dependencies = ["runapi-core>=0.6.0"]

[project.urls]
Homepage = "https://runapi.ai/models/infinitetalk"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/infinitetalk-sdk"
Issues = "https://github.com/runapi-ai/infinitetalk-sdk/issues"
Changelog = "https://github.com/runapi-ai/infinitetalk-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/infinitetalk-sdk/releases/tag/python%2Fv0.2.1"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "infinitetalk"
